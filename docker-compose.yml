version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: apartment-marketplace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailcatcher:
    image: sj26/mailcatcher
    container_name: apartment-marketplace-mailcatcher
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP port

volumes:
  pgdata:
